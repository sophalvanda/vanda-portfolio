name: Build & Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Run PHP Tests
        run: |
          cd backend
          composer install
          # Skip tests if you don't have them yet, otherwise:
          # php artisan test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vanda-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/vanda-backend:${{ github.sha }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          # This bakes your AWS IP into the frontend build
          build-args: |
            VITE_API_URL=http://${{ secrets.AWS_HOST }}/api/v1
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vanda-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # 1. Fix folder ownership so we can write files
            sudo mkdir -p ~/vanda-portfolio
            sudo chown -R $USER:$USER ~/vanda-portfolio
            cd ~/vanda-portfolio

            # 2. Force write the .env file (using tee to avoid permission errors)
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" | tee .env > /dev/null
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" | tee -a .env > /dev/null
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" | tee -a .env > /dev/null
            echo "APP_KEY=${{ secrets.APP_KEY }}" | tee -a .env > /dev/null

            # 3. Pull and Start (Hardcoding 'sudo' ensures Docker has permission)
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans

            # 4. Final Laravel Setup
            sleep 10
            sudo docker exec laravel_backend php artisan migrate --force
            sudo docker exec -u root laravel_backend chown -R www-data:www-data /var/www/html/storage
            
            echo "🚀 Deployment finished successfully!"