name: Build & Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Run PHP Tests
        run: |
          cd backend
          composer install
          # Skip tests if you don't have them yet, otherwise:
          # php artisan test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vanda-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/vanda-backend:${{ github.sha }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          # This bakes your AWS IP into the frontend build
          build-args: |
            VITE_API_URL=http://${{ secrets.AWS_HOST }}/api/v1
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vanda-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # 1. Create directory if missing and enter it
            mkdir -p ~/vanda-portfolio
            cd ~/vanda-portfolio

            # 2. Update the server's .env with the Docker Hub username
            # This ensures 'docker compose pull' knows which images to grab
            if [ ! -f .env ]; then touch .env; fi
            sed -i "s|^DOCKER_USERNAME=.*|DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}|g" .env || echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env

            # 3. Pull and Restart
            docker compose pull
            docker compose up -d --remove-orphans

            # 4. Wait for MySQL to be healthy before migrating
            echo "Waiting for database..."
            sleep 10 

            # 5. Laravel Commands
            docker exec laravel_backend php artisan migrate --force
            docker exec laravel_backend php artisan config:cache
            docker exec laravel_backend php artisan route:cache

            # 6. FIX: Permissions (Solves the 500 error)
            docker exec -u root laravel_backend chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
            
            echo "✅ Deployment Successful!"