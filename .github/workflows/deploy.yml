name: Build & Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: mbapro/vanda-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            VITE_API_URL=http://${{ secrets.AWS_HOST }}/api/v1
          push: true
          tags: mbapro/vanda-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/vanda-portfolio
            
            # 1. Pull the new images
            docker compose pull

            # 2. Restart the containers
            docker compose up -d --remove-orphans

            # 3. Wait for Database to be Healthy
            echo "Waiting for MySQL to wake up..."
            sleep 20

            # 4. Run Laravel setup inside the container
            docker exec laravel_backend php artisan migrate --force
            docker exec laravel_backend php artisan config:cache
            docker exec -u root laravel_backend chown -R www-data:www-data /var/www/html/storage
            
            echo "🚀 Portfolio is LIVE at http://${{ secrets.AWS_HOST }}"