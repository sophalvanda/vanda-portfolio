name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/vanda-backend ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/vanda-backend

    - name: Build and Push Frontend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/vanda-frontend ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/vanda-frontend

    - name: Deploy to Server
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/vanda-portfolio
          
          # Pull latest images
          docker pull ${{ secrets.DOCKER_USERNAME }}/vanda-backend
          docker pull ${{ secrets.DOCKER_USERNAME }}/vanda-frontend

          # Stop and remove old containers
          docker stop laravel_backend vue_frontend || true
          docker rm laravel_backend vue_frontend || true

          # START BACKEND
          # Note: We use --network so it can talk to your 'db' container
          docker run -d \
            --name laravel_backend \
            --network vanda-portfolio_default \
            --restart unless-stopped \
            -p 9000:9000 \
            ${{ secrets.DOCKER_USERNAME }}/vanda-backend

          # START FRONTEND
          docker run -d \
            --name vue_frontend \
            --network vanda-portfolio_default \
            --restart unless-stopped \
            -p 80:5173 \
            ${{ secrets.DOCKER_USERNAME }}/vanda-frontend

          # FIX PERMISSIONS (The "Permission Denied" Fix)
          docker exec -u root laravel_backend chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache
          docker exec -u root laravel_backend chmod -R 775 /var/www/storage /var/www/bootstrap/cache
          
          # RUN MIGRATIONS
          docker exec laravel_backend php artisan migrate --force
          docker exec laravel_backend php artisan config:cache