name: Vanda Portfolio CI/CD

on:
  push:
    branches: [ main ]

jobs:
  push-to-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vanda-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: VITE_API_URL=http://${{ secrets.AWS_HOST }}/api/v1
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vanda-frontend:latest

  deploy-to-aws:
    needs: push-to-registry
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/vanda-portfolio
            # Update the environment file on server
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
            
            docker-compose pull
            docker-compose up -d
            
            # Fix Permissions and Database
            docker exec -u root laravel_backend chown -R www-data:www-data /var/www/html/storage
            docker exec laravel_backend php artisan migrate --force