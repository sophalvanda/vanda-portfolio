name: Build & Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vanda-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            VITE_API_URL=http://${{ secrets.AWS_HOST }}/api/v1
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/vanda-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Copy the docker-compose and nginx config to the server
      - name: Copy config files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "docker-compose.yml,nginx/default.conf"
          target: "~/vanda-portfolio/"

      # 2. SSH into the server and run the deployment commands
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/vanda-portfolio
            
            # Use the Secret to pull images safely
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} docker compose pull

            # Restart containers with the new images
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} docker compose up -d --remove-orphans

            # Wait for MySQL to initialize
            echo "Waiting for database..."
            sleep 20

            # Run Laravel optimizations and migrations
            docker exec laravel_backend php artisan migrate --force
            docker exec laravel_backend php artisan config:cache
            docker exec laravel_backend php artisan view:clear
            
            # Ensure the server can write to the storage folder
            docker exec -u root laravel_backend chown -R www-data:www-data /var/www/html/storage
            
            echo "✅ Portfolio updated and LIVE!"