deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # 1. Setup directory and fix permissions
            sudo mkdir -p ~/vanda-portfolio
            sudo chown -R $USER:$USER ~/vanda-portfolio
            cd ~/vanda-portfolio

            # 2. Create the .env file (Bypass the permission issue)
            # Note: We use sudo tee to ensure the file is written even if locked
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" | sudo tee .env > /dev/null
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" | sudo tee -a .env > /dev/null
            echo "APP_KEY=${{ secrets.APP_KEY }}" | sudo tee -a .env > /dev/null
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" | sudo tee -a .env > /dev/null

            # 3. Pull images (Using the hardcoded names in your docker-compose.yml)
            # This ensures we don't get "invalid reference format"
            sudo docker compose pull

            # 4. Restart containers
            sudo docker compose up -d --remove-orphans

            # 5. Wait for DB to be healthy, then run Laravel setup
            sleep 10
            sudo docker exec laravel_backend php artisan migrate --force
            sudo docker exec laravel_backend php artisan key:generate --show || true
            sudo docker exec -u root laravel_backend chown -R www-data:www-data /var/www/html/storage
            
            echo "🚀 Portfolio is LIVE!"