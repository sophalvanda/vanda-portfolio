name: Build & Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: mbapro/vanda-backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            VITE_API_URL=http://${{ secrets.AWS_HOST }}/api/v1
          push: true
          tags: mbapro/vanda-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # 1. Ensure directory exists and move into it
            mkdir -p ~/vanda-portfolio
            cd ~/vanda-portfolio

            # 2. Check if docker-compose.yml exists, if not, create a basic one
            if [ ! -f "docker-compose.yml" ]; then
              echo "Error: docker-compose.yml not found. Please create it on the server."
              exit 1
            fi

            # 3. Pull and Restart
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans

            # 4. Wait for containers to initialize
            echo "Waiting for services to start..."
            sleep 20

            # 5. Run Laravel setup (Using sudo to ensure permissions)
            sudo docker exec laravel_backend php artisan migrate --force || echo "Migration failed"
            sudo docker exec -u root laravel_backend chown -R www-data:www-data /var/www/html/storage
            
            echo "🚀 Portfolio is LIVE!"