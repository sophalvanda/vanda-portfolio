name: Deploy Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/vanda-backend ./backend
        docker push ${{ secrets.DOCKER_USERNAME }}/vanda-backend

    - name: Build and Push Frontend
      # We pass both VITE_API_URL and VITE_API_BASE_URL to ensure the build catches it
      run: |
        docker build \
          --build-arg VITE_API_URL=http://${{ secrets.SERVER_IP }}/api/v1 \
          --build-arg VITE_API_BASE_URL=http://${{ secrets.SERVER_IP }}/api/v1 \
          -t ${{ secrets.DOCKER_USERNAME }}/vanda-frontend ./frontend
        docker push ${{ secrets.DOCKER_USERNAME }}/vanda-frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/vanda-portfolio
          
          # 1. Pull latest images from Docker Hub
          docker pull ${{ secrets.DOCKER_USERNAME }}/vanda-backend
          docker pull ${{ secrets.DOCKER_USERNAME }}/vanda-frontend

          # 2. Stop and remove old containers to prevent port conflicts
          docker stop laravel_backend vue_frontend || true
          docker rm laravel_backend vue_frontend || true

          # 3. Create network if it doesn't exist (Safety for IT pros)
          docker network create vanda-portfolio_default || true

          # 4. START BACKEND
          docker run -d \
            --name laravel_backend \
            --network vanda-portfolio_default \
            --restart unless-stopped \
            -p 9000:9000 \
            ${{ secrets.DOCKER_USERNAME }}/vanda-backend

          # 5. START FRONTEND (Mapping port 80 for public access)
          docker run -d \
            --name vue_frontend \
            --network vanda-portfolio_default \
            --restart unless-stopped \
            -p 80:80 \
            ${{ secrets.DOCKER_USERNAME }}/vanda-frontend

          # 6. PERMISSIONS: Ensure Laravel can write logs/cache
          docker exec -u root laravel_backend chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache
          docker exec -u root laravel_backend chmod -R 775 /var/www/storage /var/www/bootstrap/cache
          
          # 7. REFRESH: Clear Laravel cache and sync database
          docker exec laravel_backend php artisan optimize:clear
          docker exec laravel_backend php artisan migrate --force