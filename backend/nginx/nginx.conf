server {
    listen 80;
    
    # 1. Match the WORKDIR in your Laravel Dockerfile
    root /var/www/html/public;
    index index.php;

    # 2. Character encoding and logging
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. PHP-FPM Bridge
    location ~ \.php$ {
        # FIX: Ensure 'backend' matches the service name in your docker-compose.yml
        # If your service is 'laravel_backend', change this to laravel_backend:9000
        fastcgi_pass backend:9000;
        
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Prevent 504 Gateway Timeout during long migrations
        fastcgi_read_timeout 300;
    }

    # 4. Security: Block access to .env or .git files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}