server {
    listen 80;
    server_name 13.239.31.154;

    # 1. Frontend - Point this to the path used in your Dockerfile 'COPY' command
    root /app; 
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend - API routing
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. PHP-FPM Bridge
    location ~ \.php$ {
        # This path must match the WORKDIR of your Laravel container exactly
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php; 
        
        # 'laravel_backend' works because both containers are on the same Docker network
        fastcgi_pass laravel_backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        
        # Standard PHP-FPM parameters
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Added security and performance headers
        fastcgi_param HTTP_PROXY ""; 
    }

    # Disable access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}