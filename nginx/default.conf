server {
    listen 80;
    server_name 13.239.31.154;

    # 1. FRONTEND: Match the path where Vue build files are stored
    # In our Dockerfile, this is usually /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. API Routing
    location /api {
        # This sends /api/v1/user to Laravel as /index.php/v1/user
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. PHP-FPM Bridge (Talking to laravel_backend)
    location ~ \.php$ {
        # This MUST match the WORKDIR inside your Laravel Dockerfile
        # Based on your setup, this is likely /var/www/html/public/index.php
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_pass laravel_backend:9000;
        include fastcgi_params;
        
        # Increase timeouts for long-running migrations/seeds
        fastcgi_read_timeout 300;
    }

    # Optional: Deny access to .env files
    location ~ /\.env {
        deny all;
    }
}