server {
    listen 80;
    server_name 13.239.31.154; # You can use 'localhost' or your Public IP

    # Frontend - Where the Vue.js built files live
    root /var/www/frontend/dist;
    index index.html;

    # Support for Vue Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend - Forward API requests to Laravel
      location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass laravel_backend:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
      }

      location /api {
      try_files $uri $uri/ /index.php?$query_string;
      }

      # Optional: Deny access to .env files for security
      location ~ /\. {
            deny all;
      }
}