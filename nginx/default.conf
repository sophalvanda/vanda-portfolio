server {
    listen 80;
    server_name 13.239.31.154; # You can use 'localhost' or your Public IP

    # Frontend - Where the Vue.js built files live
    root /var/www/frontend/dist;
    index index.html;

    # Support for Vue Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend - Forward API requests to Laravel
    location /api {
        proxy_pass http://backend:9000; # 'backend' must match your docker-compose service name
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Deny access to .env files for security
    location ~ /\. {
        deny all;
    }
}