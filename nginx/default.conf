server {
    listen 80;
    server_name 13.239.31.154;

    # FIX: This must match the volume path in your docker-compose.yml
    root /var/www/frontend/dist; 
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Routing
    location /api {
        # Proxy to Laravel's index.php
        rewrite ^/api/(.*)$ /index.php?/$1 last;
    }

    # PHP-FPM Bridge
    location ~ \.php$ {
        # Ensure this matches Laravel container's internal WORKDIR
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php; 
        fastcgi_pass laravel_backend:9000;
        include fastcgi_params;
    }
}