server {
    listen 80;
    server_name 13.239.31.154;

    # 1. Frontend - Standard Vue.js path
    root /var/www/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend - Handle /api requests by sending them to index.php
    location /api {
        # We rewrite the request so it hits index.php inside the backend container
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. PHP-FPM Bridge
    location ~ \.php$ {
        # IMPORTANT: Change this path to match the WORKDIR inside your Laravel container
        # Usually it is /var/www or /var/www/html
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php; 
        
        fastcgi_pass laravel_backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\. {
        deny all;
    }
}