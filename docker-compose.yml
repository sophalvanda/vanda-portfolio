services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: vanda_portfolio
      MYSQL_USER: vandausr
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vanda-network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
    networks:
      - vanda-network

  backend:
    image: mbapro/vanda-backend:latest
    container_name: laravel_backend
    restart: always
    working_dir: /var/www/html
    env_file: ./backend/.env
    environment:
      DB_HOST: mysql_db
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      # Removed the ./backend:/var/www/html mapping
      # We only keep the persistent storage for logs/uploads
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vanda-network

  frontend:
    image: mbapro/vanda-frontend:latest
    container_name: vue_frontend
    restart: always
    networks:
      - vanda-network

  webserver:
    image: nginx:stable-alpine
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Removed the ./backend mount here too
    depends_on:
      - backend
      - frontend
    networks:
      - vanda-network

networks:
  vanda-network:
    driver: bridge

volumes:
  mysql_data:
  backend_storage: