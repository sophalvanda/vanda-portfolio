services:
  # 1. Database Service (MySQL)
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: vanda_portfolio
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vanda-network

  # 2. Cache Service (Redis)
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vanda-network

  # 3. Backend Service (Laravel 11 / PHP-FPM)
  backend:
    # FIX: Ensure no leading slash and use quotes for safety
    image: "${DOCKER_USERNAME}/vanda-backend:latest"
    container_name: laravel_backend
    restart: always
    env_file: ./backend/.env
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vanda-network

  # 4. Frontend Service (Vue.js / Vite)
  frontend:
    # FIX: Ensure no leading slash and use quotes for safety
    image: "${DOCKER_USERNAME}/vanda-frontend:latest"
    container_name: vue_frontend
    restart: always
    networks:
      - vanda-network

  # 5. Web Server Service (Nginx Proxy)
  webserver:
    image: nginx:stable-alpine
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - vanda-network

networks:
  vanda-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_storage: