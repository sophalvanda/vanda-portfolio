services:
  backend:
    image: ${DOCKER_USERNAME}/vanda-backend:latest
    container_name: laravel_backend
    restart: always
    networks: [vanda-network]
    env_file: ./backend/.env
    volumes:
      - backend_storage:/var/www/html/storage
      - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "base:health"] # Or ["CMD", "php", "-r", "echo ok;"]
      interval: 30s
      retries: 3

  frontend:
    image: ${DOCKER_USERNAME}/vanda-frontend:latest
    container_name: vue_frontend
    restart: always
    networks: [vanda-network]

  webserver:
    image: ${DOCKER_USERNAME}/vanda-nginx:latest
    container_name: nginx_server
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./backend/public:/var/www/html/public
      - backend_storage:/var/www/html/storage
    networks: [vanda-network]
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes: 
      - mysql_data:/var/lib/mysql
    networks: [vanda-network]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5
      timeout: 5s

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [vanda-network]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 3
      timeout: 5s                                 

networks:
  vanda-network:
    driver: bridge

volumes:
  backend_storage:
  mysql_data:
  redis_data: